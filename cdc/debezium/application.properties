# Debezium Server 2.7: Postgres logical replication -> Redpanda.
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=127.0.0.1:9092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.acks=all

debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000
debezium.source.database.hostname=127.0.0.1
debezium.source.database.port=5432
debezium.source.database.user=agedcare
debezium.source.database.password=agedcare
debezium.source.database.dbname=agedcare
debezium.source.topic.prefix=agedcare
debezium.source.plugin.name=pgoutput
debezium.source.schema.include.list=registry
debezium.source.table.include.list=registry.providers,registry.services,registry.places_by_year
debezium.source.publication.autocreate.mode=filtered
debezium.source.publication.name=agedcare_publication
debezium.source.slot.name=agedcare_slot
debezium.source.tombstones.on.delete=false
debezium.source.snapshot.mode=initial
debezium.source.decimal.handling.mode=double
debezium.source.key.converter=org.apache.kafka.connect.json.JsonConverter
debezium.source.key.converter.schemas.enable=false
debezium.source.value.converter=org.apache.kafka.connect.json.JsonConverter
debezium.source.value.converter.schemas.enable=false
debezium.format.key=json
debezium.format.value=json
quarkus.log.level=INFO
